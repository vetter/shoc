# SHOC Driver Configuration - MPI Multi-Node Cluster
# Usage: ./tools/shocdriver.py --config config/examples/mpi-cluster.yaml

backend: cuda
size: 3
devices: "0,1,2,3"  # 4 GPUs per node
platform: "0"
num_nodes: 4  # 4 nodes = 16 total MPI ranks
hostfile: ./hostfile.txt  # List of cluster nodes
bin_dir: ./install-cuda/bin
log_dir: ./Logs/cluster-run
parallel_execution: false  # Don't run benchmarks in parallel when using MPI
max_workers: 1
